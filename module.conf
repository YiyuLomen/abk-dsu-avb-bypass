# ABK external module metadata.
# ABK reads this file to validate and prefill module options.

ABK_MODULE_NAME="ABK First-Stage Orange Bootconfig"
ABK_MODULE_VERSION="0.1.0"
ABK_MODULE_DESCRIPTION="让 first-stage init（PID 1）从 /proc/bootconfig 读到 verifiedbootstate=orange，PID 1 exec /system/bin/init 后自动关闭；不修改 vbmeta、不改 SELinux、不依赖 DSU。"
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch,before_build"

# 1 = 补丁缺失或未启用时让构建失败（推荐）
ABK_DSU_AVB_STRICT="${ABK_DSU_AVB_STRICT:-1}"
